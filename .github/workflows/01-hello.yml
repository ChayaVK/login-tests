name: 01 Hello Actions

on: push

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Say hello
        run: echo "Hello from GitHub Actions on branch ${{ github.ref_name }}"

      - name: Show the tools on the runner
        run: |
          node --version
          git --version
