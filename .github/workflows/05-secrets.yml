name: 05 Secrets and environments

on: push

env:
  BASE_URL: http://localhost:3000

jobs:
  qa:
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - name: Use a secret
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Base URL is $BASE_URL"
          echo "The token is $TOKEN"
          echo "Token length: ${#TOKEN}"
