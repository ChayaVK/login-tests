name: Reusable test run

on:
  workflow_call:
    inputs:
      project:
        type: string
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tests
        with:
          browser: ${{ inputs.project }}
      - run: npx playwright test --project=${{ inputs.project }}
